group = "dev.dint.cryptography_flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// [iperon fork] AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin
// Gradle Plugin. Apply KGP only when built-in Kotlin is NOT active: AGP < 9, or AGP 9
// with android.builtInKotlin=false (the config the app currently ships while the
// ecosystem migrates). Mirrors the guard livekit_client / flutter_webrtc already ship.
// Upstream cryptography_flutter 2.3.4 is the last release on pub.dev and applies KGP
// unconditionally, which is why this package is vendored here — see
// third_party/cryptography_flutter/README fork note and CLAUDE.md's Kotlin migration.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty("android.builtInKotlin") ||
        Boolean.parseBoolean(project.property("android.builtInKotlin").toString()))
if (!builtInKotlinActive) {
    apply plugin: "kotlin-android"
}

android {
    namespace = "dev.dint.cryptography_flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

dependencies {
    implementation "androidx.security:security-crypto:1.1.0"
}

// [iperon fork] Configure the Kotlin JVM target in both modes. The in-`android`
// `kotlinOptions { }` block only exists when KGP is applied, so under AGP 9 built-in
// Kotlin (KGP guarded off above) it throws "Could not find method kotlinOptions()".
// Mirrors the compilerOptions/kotlinOptions split livekit_client / flutter_webrtc ship.
def kotlinExt = project.extensions.findByName("kotlin")
if (kotlinExt?.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}