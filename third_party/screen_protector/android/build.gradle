plugins {
    id 'com.android.library'
}

// [iperon fork] Upstream applies KGP only for AGP < 9, assuming AGP 9 always compiles
// Kotlin itself. The app ships AGP 9 with android.builtInKotlin=false, where nothing
// compiles the plugin's Kotlin sources → «cannot find symbol ScreenProtectorPlugin» in
// GeneratedPluginRegistrant. Apply KGP whenever built-in Kotlin is NOT active (AGP < 9,
// or AGP 9 with android.builtInKotlin=false) — same guard as third_party/cryptography_flutter.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty("android.builtInKotlin") ||
        Boolean.parseBoolean(project.property("android.builtInKotlin").toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

group 'com.prongbang.screen_protector'

android {
    namespace 'com.prongbang.screen_protector'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdk 21
        targetSdk 36
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}

// [iperon fork] Kotlin — тем же JVM 17, что и Java (иначе «Inconsistent JVM-target
// compatibility»: KGP по умолчанию берёт версию JDK). Двухрежимно — как в
// third_party/cryptography_flutter.
def kotlinExt = project.extensions.findByName("kotlin")
if (kotlinExt?.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
}
