group = "com.vk.vkid.flutter.vkid_flutter_sdk"
version = "1.0-SNAPSHOT"

buildscript {
    // [iperon fork] Kotlin — как в приложении (android/settings.gradle.kts): классы KGP
    // для сборки плагина берутся с корневой сборки, а плагин Compose-компилятора ниже
    // должен быть той же версии. Апстрим держал 2.0.20.
    ext.kotlin_version = "2.3.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.1.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
        classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            // [iperon fork] Artifactory VK (artifactory-external.vkpartner.ru) SDK больше
            // не отдаёт; артефакты переехали в Nexus (CHANGELOG vkid-android-sdk 2.7.3).
            // Фильтр — тот же, что в android/build.gradle.kts приложения (com.vk.* и
            // ru.ok.tracer — зависимость tracking-tracer): две декларации одного URL с
            // разным содержимым для Gradle — два репозитория, и без фильтра здесь второй
            // отвечал бы на запросы любых групп.
            url("https://nexus-external.vkteam.ru/repository/maven/")
            content { includeGroupByRegex("(com\\.vk|ru\\.ok\\.tracer)(\\..*)?") }
        }
    }
}

apply plugin: "com.android.library"

// [iperon fork] AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin
// Gradle Plugin. Apply KGP only when built-in Kotlin is NOT active: AGP < 9, or AGP 9
// with android.builtInKotlin=false (the config the app currently ships while the
// ecosystem migrates). Same guard as third_party/cryptography_flutter and
// third_party/flutter_callkit_incoming. Upstream applies KGP unconditionally
// (VKCOM/vkid-android-sdk#120).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty("android.builtInKotlin") ||
        Boolean.parseBoolean(project.property("android.builtInKotlin").toString()))
if (!builtInKotlinActive) {
    apply plugin: "kotlin-android"
}
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.vk.vkid.flutter.vkid_flutter_sdk"
    }

    compileSdk = 34

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
    }

    buildFeatures {
        compose = true
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
        implementation("com.vk.id:onetap-compose:2.6.0")
        implementation(platform("androidx.compose:compose-bom:2024.10.00"))
        implementation("androidx.compose.foundation:foundation")
        implementation("androidx.compose.material3:material3:1.3.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

// [iperon fork] JVM target Kotlin — тем же 11, что и Java, в обоих режимах: блок
// kotlinOptions { } внутри android есть только при применённом KGP, а при AGP 9
// built-in Kotlin его нет («Could not find method kotlinOptions()»). Как в
// third_party/flutter_callkit_incoming.
def kotlinExt = project.extensions.findByName("kotlin")
if (kotlinExt?.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }
}
