# ВЕНДОРЕННЫЙ ФОРК (Iperon) плагина vkid_flutter_sdk 1.0.3 (MIT).
# Подключён через dependency_overrides в корневом pubspec.yaml; используется для
# входа через VK ID (docs/plans/03-vk-id-login.md). Оригинал сверен с pub.dev
# (архив 1.0.3, sha256 01edb8b1…6c2327).
# Патчи (переносить вручную при апдейте плагина; места помечены «[iperon fork]»):
#   - android/build.gradle, android/settings.gradle: репозиторий VK → Nexus
#     (старый Artifactory артефакты SDK больше не отдаёт), с фильтром групп com.vk.*
#     и ru.ok.tracer — иначе репозиторий VK отвечал бы на запросы чужих библиотек;
#   - android/build.gradle: KGP применяется только без AGP 9 built-in Kotlin (guard,
#     как в остальных форках third_party/) и JVM target Kotlin — через
#     kotlin { compilerOptions } / kotlinOptions. Пока у приложения
#     android.builtInKotlin=false, это не обязательно — нужно на случай его
#     включения. Kotlin в buildscript — 2.3.20, как в android/settings.gradle.kts
#     приложения (апстрим держал 2.0.20): плагин Compose-компилятора ниже должен
#     совпадать по версии с KGP сборки;
#   - VkidFlutterSdkPlugin.kt и VkidFlutterSdkPlugin.swift: метод канала "clientId" —
#     client_id приложения VK ID, вшитый в сборку (пусто, если не заданы client_id
#     или секрет). По нему Dart решает, показывать ли вход через VK, и шлёт client_id
#     серверу (AuthVK.Request);
#   - VkidFlutterSdkPlugin.swift: ошибка авторизации — FlutterError с кодом, как на
#     Android. Апстрим отдавал в result строку, Dart-сторона превращала её в
#     AuthOtherError("unknown error") — отмена входа на iOS выглядела сбоем;
#   - android/src/test исключён: апстримный тест проверяет несуществующий метод.
# При копировании также исключены example/, scripts/, logo.svg, CODE_STYLE.md,
# CONTRIBUTING.md, gradlew и gradle-wrapper.jar.
name: vkid_flutter_sdk
description: "VK ID SDK for Flutter is the most comprehensive library for user authentication via VK ID, officially supported by VK."
version: 1.0.3
homepage: https://id.vk.ru/about/business/go/docs/ru/vkid/latest/vk-id/connection/start-integration/flutter/install

environment:
  sdk: '>=3.4.4 <4.0.0'
  flutter: '>=3.22.3'

dependencies:
  dio: ^5.7.0
  flutter:
    sdk: flutter
  material: ^1.0.0+2
  plugin_platform_interface: ^2.0.2
  synchronized: '^3.1.0+1'
  collection: ^1.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  plugin:
    platforms:
      android:
        package: com.vk.vkid.flutter.vkid_flutter_sdk
        pluginClass: VkidFlutterSdkPlugin
      ios:
        pluginClass: VkidFlutterSdkPlugin

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
