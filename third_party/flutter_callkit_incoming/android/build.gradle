apply plugin: 'com.android.library'

// [iperon fork] AGP 9's built-in Kotlin compiles Kotlin itself and rejects the Kotlin
// Gradle Plugin. Apply KGP only when built-in Kotlin is NOT active: AGP < 9, or AGP 9
// with android.builtInKotlin=false (the config the app currently ships while the
// ecosystem migrates). Mirrors the guard livekit_client / flutter_webrtc already ship.
// The plugins { } DSL can't hold a conditional, so KGP is applied the legacy way (it is
// on the buildscript classpath either way). Upstream flutter_callkit_incoming applies
// KGP unconditionally — see CLAUDE.md's Kotlin migration note.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0] as int
def builtInKotlinActive = agpMajor >= 9 &&
    (!project.hasProperty("android.builtInKotlin") ||
        Boolean.parseBoolean(project.property("android.builtInKotlin").toString()))
if (!builtInKotlinActive) {
    apply plugin: 'kotlin-android'
}

group = "com.example.flutter_callkit_incoming"
version = "1.0-SNAPSHOT"

android {
    namespace "com.hiennv.flutter_callkit_incoming"
    compileSdk = 35

    defaultConfig {
        minSdk = 16
        targetSdk = 35
        consumerProguardFiles 'consumer-rules.pro'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

}

// [iperon fork] Configure the Kotlin JVM target in both modes. The in-`android`
// `kotlinOptions { }` block only exists when KGP is applied, so under AGP 9 built-in
// Kotlin (KGP guarded off above) it throws "Could not find method kotlinOptions()".
// Mirrors the compilerOptions/kotlinOptions split livekit_client / flutter_webrtc ship.
def kotlinExt = project.extensions.findByName("kotlin")
if (kotlinExt?.hasProperty("compilerOptions")) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
        }
    }
} else {
    android.kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.11.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.11.1'
    //noinspection GradleDependency
    implementation "io.coil-kt:coil:1.4.0"
}