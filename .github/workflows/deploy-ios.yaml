name: Deploy iOS → TestFlight

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"
  BUNDLE_ID: "net.iperon.messenger"
  APPLE_TEAM_ID: "BPXUY5LQZC"
  BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

jobs:
  testflight:
    name: Сборка и загрузка в TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true

      - name: Restore Firebase config files
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@b2e261033a9e248f91a9b57201e8d1e12b15a24e # v7.0.0
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp profile.mobileprovision "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Установлен profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Force manual signing for archive
        env:
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
        run: |
          set -euo pipefail
          # В pbxproj у таргета Runner (Release) нет CODE_SIGN_STYLE, поэтому по
          # умолчанию Xcode берёт Automatic — на CI без залогиненного Apple ID
          # archive с ручным App Store профилем падает. Эти ключи в pbxproj не
          # заданы, значит их можно доопределить через Release.xcconfig (это
          # baseConfigurationReference таргета, он перекрывает project-level
          # настройки). pbxproj при этом не трогаем.
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

      - name: Generate ExportOptions.plist
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build IPA
        run: |
          set -euo pipefail
          # Имя версии берём из тега (v0.0.1 → 0.0.1), номер сборки — из счётчика запусков,
          # чтобы каждый билд в TestFlight был уникальным.
          BUILD_NAME="${GITHUB_REF_NAME#v}"
          flutter build ipa \
            --release \
            --build-name="$BUILD_NAME" \
            --build-number="${{ github.run_number }}" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA_PATH=$PWD/$IPA" >> "$GITHUB_ENV"
          echo "IPA: $IPA"

      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane beta
