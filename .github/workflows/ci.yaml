name: CI

on:
  pull_request:
  push:
    branches: [main]

# Отменяем предыдущие запуски для той же ветки/PR — экономим минуты.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Verify generated code is up to date
        run: |
          # -I игнорирует строку-таймстамп slang («Built on <дата> at <время> UTC»):
          # она меняется при каждом запуске и иначе всегда роняла бы гейт.
          if ! git diff --exit-code -I '^/// Built on .* at .* UTC$' -- '*.mapper.dart' 'lib/i18n/translations*.g.dart'; then
            echo "::error::Сгенерированный код устарел. Запустите 'dart run build_runner build --delete-conflicting-outputs' и 'dart run slang', затем закоммитьте изменения."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

  build-ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Firebase config files
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase.json
        run: |
          set -euo pipefail
          # firebase.json нужен build-фазе Crashlytics (flutterfire
          # upload-crashlytics-symbols), но он в .gitignore. Секретов в нём нет
          # (только projectId и публичные appId), поэтому пишем его прямо тут.
          cat > firebase.json <<'EOF'
          {"flutter":{"platforms":{"android":{"default":{"projectId":"iperon","appId":"1:434986283436:android:4f866c85c25982c9950a09","fileOutput":"android/app/google-services.json"}},"ios":{"default":{"projectId":"iperon","appId":"1:434986283436:ios:06524099437889e9950a09","uploadDebugSymbols":false,"fileOutput":"ios/Runner/GoogleService-Info.plist"}},"dart":{"lib/firebase_options.dart":{"projectId":"iperon","configurations":{"android":"1:434986283436:android:4f866c85c25982c9950a09","ios":"1:434986283436:ios:06524099437889e9950a09"}}}}}}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Create .env asset files
        run: |
          set -euo pipefail
          # .env и .env.development объявлены ассетами в pubspec, но лежат в
          # .gitignore — без них падает бандлинг ассетов. Для проверочной
          # сборки достаточно пустых файлов (значения читаются из Remote Config).
          touch .env .env.development

      - name: Install FlutterFire CLI
        run: |
          set -euo pipefail
          # В проекте есть build-фаза «FlutterFire: upload-crashlytics-symbols»,
          # вызывающая CLI `flutterfire`. Ставим его и кладём pub-cache/bin в
          # PATH (через GITHUB_PATH), чтобы скрипт-фаза Xcode нашла команду.
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build iOS
        run: flutter build ios --release --no-codesign
