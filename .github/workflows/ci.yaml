name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore firebase_options.dart
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Verify generated code is up to date
        run: |
          # -I ignores the slang timestamp line ("Built on <date> at <time> UTC"):
          # it changes on every run and would otherwise always fail the gate.
          if ! git diff --exit-code -I '^/// Built on .* at .* UTC$' -- '*.mapper.dart' 'lib/i18n/translations*.g.dart'; then
            echo "::error::Generated code is out of date. Run 'dart run build_runner build --delete-conflicting-outputs' and 'dart run slang', then commit the changes."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Create .env asset files
        run: |
          set -euo pipefail
          # .env and .env.development are declared as assets in pubspec but are
          # gitignored — without them analyze reports asset_does_not_exist.
          touch .env .env.development

      - name: Analyze
        run: flutter analyze

  build-ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Firebase config files
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase.json
        run: |
          set -euo pipefail
          # firebase.json is needed by the Crashlytics build phase (flutterfire
          # upload-crashlytics-symbols) but is gitignored. It holds no secrets
          # (only projectId and public appIds), so we write it inline here.
          cat > firebase.json <<'EOF'
          {"flutter":{"platforms":{"android":{"default":{"projectId":"iperon","appId":"1:434986283436:android:4f866c85c25982c9950a09","fileOutput":"android/app/google-services.json"}},"ios":{"default":{"projectId":"iperon","appId":"1:434986283436:ios:06524099437889e9950a09","uploadDebugSymbols":false,"fileOutput":"ios/Runner/GoogleService-Info.plist"}},"dart":{"lib/firebase_options.dart":{"projectId":"iperon","configurations":{"android":"1:434986283436:android:4f866c85c25982c9950a09","ios":"1:434986283436:ios:06524099437889e9950a09"}}}}}}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Create .env asset files
        run: |
          set -euo pipefail
          # .env and .env.development are declared as assets in pubspec but are
          # gitignored — without them asset bundling fails. Empty files are
          # enough for the check build (values are read from Remote Config).
          touch .env .env.development

      - name: Install FlutterFire CLI
        run: |
          set -euo pipefail
          # The project has a "FlutterFire: upload-crashlytics-symbols" build
          # phase that calls the `flutterfire` CLI. Install it and add
          # pub-cache/bin to PATH (via GITHUB_PATH) so the Xcode script phase
          # can find the command.
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Build iOS
        run: flutter build ios --release --no-codesign
