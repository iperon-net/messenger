name: Test

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
    secrets:
      firebase_options_dart_base64:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Flutter tests
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.firebase_options_dart_base64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          dart format lib/firebase_options.dart

      - name: Create .env asset files
        run: |
          set -euo pipefail
          touch .env .env.development

      - name: Install LCOV
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lcov

      - name: Run tests with coverage
        run: flutter test --no-pub --coverage

      - name: Check coverage threshold
        run: lcov --summary coverage/lcov.info --fail-under-lines 16.25

      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info --output-directory coverage/html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-test-coverage
          path: |
            coverage/html/
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
