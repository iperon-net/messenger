name: Linter

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
    secrets:
      firebase_options_dart_base64:
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.firebase_options_dart_base64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          dart format lib/firebase_options.dart

      - name: Create .env asset files
        run: |
          set -euo pipefail
          touch .env .env.development

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.firebase_options_dart_base64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          dart format lib/firebase_options.dart

      - name: Create .env asset files
        run: |
          set -euo pipefail
          touch .env .env.development

      - name: Analyze
        run: flutter analyze
