name: Build and Publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: deploy-ios-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  Linter:
    uses: iperon-net/messenger/.github/workflows/_linter.yaml@main
    with:
      flutter_version: "3.47.8"
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

  TestFlight:
    uses: iperon-net/messenger/.github/workflows/_deploy_testflight.yaml@main
    needs: Linter
    with:
      flutter_version: "3.47.8"
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
      ios_google_service_info_plist_base64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
      ios_dist_cert_p12_base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      ios_dist_cert_password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      ios_provisioning_profile_base64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      ios_nse_provisioning_profile_base64: ${{ secrets.IOS_NSE_PROVISIONING_PROFILE_BASE64 }}
      asc_key_id: ${{ secrets.ASC_KEY_ID }}
      asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
      asc_key_p8_base64: ${{ secrets.ASC_KEY_P8_BASE64 }}

  # Десктоп macOS (DMG + автообновление, docs/plans/desktop-client.md §10). Пока
  # секретов нет — неподписанный DMG только артефактом, релиз не создаётся.
  macOS:
    uses: iperon-net/messenger/.github/workflows/_deploy_macos.yaml@main
    needs: Linter
    # Публикация — GitHub Release этого репо.
    permissions:
      contents: write
    with:
      flutter_version: "3.47.8"
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
      macos_developer_id_p12_base64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      macos_developer_id_password: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
      asc_key_id: ${{ secrets.ASC_KEY_ID }}
      asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
      asc_key_p8_base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      sparkle_ed_private_key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
