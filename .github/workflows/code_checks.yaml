name: Code checks

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  analyze:
    name: Code checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase config
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          set -euo pipefail
          # lib/firebase_options.dart is gitignored, but main.dart imports it —
          # без него analyze падает с uri_does_not_exist. Восстанавливаем из
          # секрета (тот же, что и в деплое iOS).
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Create .env asset files
        run: |
          set -euo pipefail
          # .env и .env.development объявлены как assets в pubspec, но
          # gitignored. Для analyze достаточно пустых файлов.
          touch .env .env.development

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze
