name: TestFlight

on:
  workflow_call:
    inputs:
      flutter_version:
        required: true
        type: string
    secrets:
      firebase_options_dart_base64:
        required: true
      ios_google_service_info_plist_base64:
        required: true
      ios_dist_cert_p12_base64:
        required: true
      ios_dist_cert_password:
        required: true
      ios_provisioning_profile_base64:
        required: true
      asc_key_id:
        required: true
      asc_issuer_id:
        required: true
      asc_key_p8_base64:
        required: true


env:
  BUNDLE_ID: "net.iperon.messenger"
  APPLE_TEAM_ID: "BPXUY5LQZC"
  BUNDLE_GEMFILE: ${{ github.workspace }}/ios/Gemfile

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Полная история нужна, чтобы собрать changelog из всех коммитов
          # для поля «Сведения о тестировании» в TestFlight (см. шаг ниже).
          fetch-depth: 0

      - name: Resolve version from tag
        run: |
          set -euo pipefail
          # Сборка запускается по push тега v* (github.ref_name — имя этого тега),
          # поэтому имя версии (BUILD_NAME) берём прямо из тега, срезая префикс v.
          # Номер билда — из UTC-даты (см. шаг «Build IPA»), так что он уникален
          # даже при нескольких сборках на одном теге.
          CURRENT_TAG="${GITHUB_REF_NAME}"
          BUILD_NAME="${CURRENT_TAG#v}"
          echo "Tag: ${CURRENT_TAG} → BUILD_NAME=${BUILD_NAME}"
          echo "CURRENT_TAG=$CURRENT_TAG" >> "$GITHUB_ENV"
          echo "BUILD_NAME=$BUILD_NAME" >> "$GITHUB_ENV"

      - name: Build changelog (What to Test)
        run: |
          set -euo pipefail
          # Собираем список коммитов (от новых к старым) для поля whatToTest
          # («Сведения о тестировании») в TestFlight. Берём диапазон между
          # предыдущим тегом v* и текущим (тем, что запустил сборку), то есть
          # «что вошло в этот релиз относительно прошлого». Предыдущий тег ищем
          # через git describe от родителя текущего тега. Если предыдущего тега
          # нет (это первый релиз), берём всю историю до текущего тега.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${CURRENT_TAG}^" 2>/dev/null || true)
          RANGE=${PREV_TAG:+"${PREV_TAG}.."}${CURRENT_TAG}
          echo "Changelog range: ${PREV_TAG:-<start>}..${CURRENT_TAG}"
          # Группируем коммиты по типу Conventional Commits (feat/fix/прочее),
          # у каждого коммита срезаем префикс «type(scope):» и раскладываем по
          # секциям. Лимит Apple — 4000 символов, поэтому считаем длину по мере
          # вывода и обрезаем по нему, не разрывая строки: коммиты (и целые
          # секции), которые не помещаются, просто отбрасываем.
          CHANGELOG=$(git log ${RANGE} --pretty='%s' --no-merges | awk '
            function strip(s,   r) { r = s; sub(/^[a-z]+(\([^)]*\))?!?:[ \t]*/, "", r); return r }
            function dump(title, arr, n,   i, line, header, first) {
              if (n == 0) return
              header = title ":\n"
              first = "- " arr[1] "\n"
              # печатаем заголовок, только если влезает он и хотя бы один пункт
              if (total + length(header) + length(first) > 4000) return
              printf "%s", header; total += length(header)
              for (i = 1; i <= n; i++) {
                line = "- " arr[i] "\n"
                if (total + length(line) > 4000) break
                printf "%s", line; total += length(line)
              }
              printf "\n"; total += 1
            }
            /^feat(\([^)]*\))?!?:/ { feat[++nf] = strip($0); next }
            /^fix(\([^)]*\))?!?:/  { fix[++nx]  = strip($0); next }
                                   { other[++no] = strip($0) }
            END {
              total = 0
              dump("🚀 New features", feat, nf)
              dump("🐛 Bug fixes", fix, nx)
              dump("🔧 Other changes", other, no)
            }
          ')
          {
            echo "CHANGELOG<<CHANGELOG_EOF"
            echo "$CHANGELOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Setup Ruby (fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore Firebase config files
        env:
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.firebase_options_dart_base64 }}
          IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.ios_google_service_info_plist_base64 }}
        run: |
          set -euo pipefail
          echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 --decode > lib/firebase_options.dart
          echo "$IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist

      - name: Restore firebase.json
        run: |
          set -euo pipefail
          # firebase.json is needed by the Crashlytics build phase (flutterfire
          # upload-crashlytics-symbols) but is gitignored. It holds no secrets
          # (only projectId and public appIds), so we write it inline here.
          cat > firebase.json <<'EOF'
          {"flutter":{"platforms":{"android":{"default":{"projectId":"iperon","appId":"1:434986283436:android:4f866c85c25982c9950a09","fileOutput":"android/app/google-services.json"}},"ios":{"default":{"projectId":"iperon","appId":"1:434986283436:ios:06524099437889e9950a09","uploadDebugSymbols":false,"fileOutput":"ios/Runner/GoogleService-Info.plist"}},"dart":{"lib/firebase_options.dart":{"projectId":"iperon","configurations":{"android":"1:434986283436:android:4f866c85c25982c9950a09","ios":"1:434986283436:ios:06524099437889e9950a09"}}}}}}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate code (dart_mappable + slang)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run slang

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.ios_dist_cert_p12_base64 }}
          p12-password: ${{ secrets.ios_dist_cert_password }}

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.ios_provisioning_profile_base64 }}
        run: |
          set -euo pipefail
          echo "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          security cms -D -i profile.mobileprovision > profile.plist
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" profile.plist)
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" profile.plist)
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          cp profile.mobileprovision "$PROFILES_DIR/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($PROFILE_UUID)"

      - name: Force manual signing for archive
        env:
          PROFILE_NAME: ${{ env.PROFILE_NAME }}
        run: |
          set -euo pipefail
          # The Runner target (Release) has no CODE_SIGN_STYLE in pbxproj, so
          # Xcode defaults to Automatic — on CI without a signed-in Apple ID an
          # archive with a manual App Store profile fails. These keys are not set
          # in pbxproj, so we can define them via Release.xcconfig (the target's
          # baseConfigurationReference, which overrides project-level settings).
          # We leave pbxproj untouched.
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${APPLE_TEAM_ID}
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = ${PROFILE_NAME}
          EOF

      - name: Generate ExportOptions.plist
        run: |
          set -euo pipefail
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Install FlutterFire CLI
        run: |
          set -euo pipefail
          # The "FlutterFire: upload-crashlytics-symbols" build phase calls the
          # `flutterfire` CLI. Install it and add pub-cache/bin to PATH so the
          # Xcode script phase can find the command during archive.
          dart pub global activate flutterfire_cli
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Create .env asset files
        env:
          ENV_FILE_BASE64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          set -euo pipefail
          # .env and .env.development are declared as assets in pubspec but are
          # gitignored — without them asset bundling fails. We fill .env from the
          # ENV_FILE_BASE64 secret if set (otherwise empty — values come from
          # Firebase Remote Config). Release does not read .env.development, but
          # the file must exist for bundling.
          if [ -n "${ENV_FILE_BASE64:-}" ]; then
            echo "$ENV_FILE_BASE64" | base64 --decode > .env
          else
            touch .env
          fi
          touch .env.development

      - name: Build IPA
        run: |
          set -euo pipefail
          # Version name (BUILD_NAME) comes from the triggering v* tag, resolved
          # in the "Resolve version from tag" step; build number from a UTC
          # timestamp (YYMMDDHHMM), so every TestFlight build is unique and
          # monotonically increasing, independent of the CI run counter.
          BUILD_NUMBER="$(date -u +%y%m%d%H%M)"
          flutter build ipa \
            --release \
            --build-name="$BUILD_NAME" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Locate IPA
        run: |
          set -euo pipefail
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "IPA_PATH=$PWD/$IPA" >> "$GITHUB_ENV"
          echo "IPA: $IPA"

      - name: Upload to TestFlight
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.asc_key_id }}
          ASC_ISSUER_ID: ${{ secrets.asc_issuer_id }}
          ASC_KEY_P8_BASE64: ${{ secrets.asc_key_p8_base64 }}
          CHANGELOG: ${{ env.CHANGELOG }}
        run: bundle exec fastlane beta

      - name: Upload dSYMs to Crashlytics
        # Загружаем dSYM в Crashlytics явно, а не через build phase
        # "FlutterFire: upload-crashlytics-symbols": на CI окружение archive-фазы
        # не отдаёт корректный путь к FirebaseCrashlytics/run (уходит в SPM-ветку
        # и падает), поэтому uploadDebugSymbols в firebase.json оставлен false, а
        # символы шлём напрямую бинарником upload-symbols из готового .xcarchive.
        # Идёт последним шагом, чтобы сбой загрузки символов не блокировал релиз.
        run: |
          set -uo pipefail
          GSP="ios/Runner/GoogleService-Info.plist"
          DD="$HOME/Library/Developer/Xcode/DerivedData"

          # upload-symbols живёт в FirebaseCrashlytics, но его расположение
          # зависит от менеджера зависимостей: ios/Pods/... при CocoaPods либо
          # */SourcePackages/checkouts/firebase-ios-sdk/... при SPM. На CI Flutter
          # кладёт SPM-checkout в build/ios/SourcePackages (а не в DerivedData),
          # поэтому ищем и там; путь не совпадает с локальным, ищем по факту.
          echo "Searching for upload-symbols…"
          UPLOAD_SYMBOLS=$(find ios/Pods build "$DD" -type f -name upload-symbols 2>/dev/null | head -1 || true)
          if [ -z "$UPLOAD_SYMBOLS" ]; then
            echo "::warning::upload-symbols not found — skipping dSYM upload"
            echo "--- ios/Pods (top level) ---"; ls ios/Pods 2>/dev/null | head -60 || true
            echo "--- run/upload-symbols anywhere under workspace ---"
            find . "$DD" -type f \( -name upload-symbols -o -name run \) 2>/dev/null | grep -i crashlytics | head || true
            exit 0
          fi
          echo "Found: $UPLOAD_SYMBOLS"

          # dSYM генерирует flutter build ipa в .xcarchive независимо от менеджера
          # зависимостей; на всякий случай ищем и в DerivedData, если путь иной.
          DSYM_DIR="build/ios/archive/Runner.xcarchive/dSYMs"
          if [ ! -d "$DSYM_DIR" ]; then
            echo "::warning::dSYMs not at $DSYM_DIR — searching…"
            ALT=$(find build "$DD" -type d -name dSYMs 2>/dev/null | head -1 || true)
            if [ -z "$ALT" ]; then
              echo "::warning::no dSYMs directory found — skipping dSYM upload"
              find build "$DD" -type d -name "*.dSYM" 2>/dev/null | head || true
              exit 0
            fi
            DSYM_DIR="$ALT"
          fi
          echo "Uploading dSYMs from: $DSYM_DIR"

          chmod +x "$UPLOAD_SYMBOLS" 2>/dev/null || true
          "$UPLOAD_SYMBOLS" -gsp "$GSP" -p ios -- "$DSYM_DIR"
