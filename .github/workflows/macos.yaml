name: macOS build

# Ручная сборка macOS-клиента (Actions → macOS build → Run workflow): проверить
# сборку / подпись / нотаризацию без тега. По умолчанию DMG только артефактом;
# publish — ещё и в S3 (appcast увидят все установленные клиенты!).

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Версия (CFBundleShortVersionString)"
        required: true
        default: "0.0.0"
      publish:
        description: "Залить в S3 и обновить appcast"
        type: boolean
        default: false

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Linter:
    uses: iperon-net/messenger/.github/workflows/_linter.yaml@main
    with:
      flutter_version: "3.47.8"
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

  macOS:
    uses: iperon-net/messenger/.github/workflows/_deploy_macos.yaml@main
    needs: Linter
    with:
      flutter_version: "3.47.8"
      build_name: ${{ inputs.build_name }}
      publish: ${{ inputs.publish }}
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
      macos_developer_id_p12_base64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
      macos_developer_id_password: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
      asc_key_id: ${{ secrets.ASC_KEY_ID }}
      asc_issuer_id: ${{ secrets.ASC_ISSUER_ID }}
      asc_key_p8_base64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      sparkle_ed_private_key: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      download_s3_access_key_id: ${{ secrets.DOWNLOAD_S3_ACCESS_KEY_ID }}
      download_s3_secret_access_key: ${{ secrets.DOWNLOAD_S3_SECRET_ACCESS_KEY }}
