name: Testing code

on:
  pull_request:
  push:
    branches: [main]

jobs:
  Linter:
    # Ровно тот код, что в PR / пуше (не main).
    uses: iperon-net/messenger/.github/workflows/_linter.yaml@${{ github.sha }}
    with:
      flutter_version: "3.47.8"
      check_generated: true
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}

  Test:
    needs: [Linter]
    uses: iperon-net/messenger/.github/workflows/_test.yaml@${{ github.sha }}
    with:
      flutter_version: "3.47.8"
    secrets:
      firebase_options_dart_base64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
