# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Available tasks print
    cmd: task -l
  lang:
    desc: Update language files
    cmds:
      - dart run slang
    silent: true
  watch:
    desc: Watch for changes
    cmds:
      - dart run build_runner watch
    silent: true
  gen:
    desc: Generate code
    cmds:
      - protoc --dart_out=grpc:lib/protobuf -I=. protos/*.proto google/protobuf/timestamp.proto google/protobuf/empty.proto
      - dart run build_runner build
      - dart format lib/
    silent: true
  fmt:
    desc: Format code
    cmds:
      - dart format lib/
    silent: true
  analyze:
    desc: Analyze code
    cmds:
      - dart analyze lib/
    silent: true
  review:
    desc: Kimi code quality review (task review [-- <commit|range>])
    # Kimi запускается неинтерактивно (-p) и сам читает AGENTS.md /
    # AGENTS.local.md. По умолчанию ревьюит незакоммиченные изменения,
    # task review -- <commit> — конкретный коммит или диапазон.
    # Аргумент идёт через переменную окружения, а не текстовую подстановку
    # в shell — иначе CLI_ARGS с $()/кавычками выполняется как код.
    env:
      REVIEW_ARGS: '{{.CLI_ARGS}}'
    cmds:
      - >-
        kimi -p "Ревью качества кода: ${REVIEW_ARGS:-незакоммиченные изменения (git diff HEAD плюс untracked файлы)}.
        Прочитай AGENTS.md и AGENTS.local.md и проверь изменения на: баги и race conditions,
        ошибки обработки ошибок (offline/ошибки API не проглатываются), утечки и проблемы
        производительности, нарушения конвенций проекта, рассинхрон Cupertino и
        Material-вариантов экранов. Файлы не редактируй. Ответ: список проблем в виде
        «файл:строка — проблема и как исправить», отсортированный по важности;
        если проблем нет — одной строкой «Проблем не найдено»."
    silent: true
  plan-index:
    desc: Regenerate docs/plans/INDEX.md
    cmds:
      - scripts/gen-plan-index.sh
    silent: true
  plan-check:
    desc: Check testing marks in docs/plans
    cmds:
      - scripts/check-plans.sh
    silent: true
  apk:
    desc: Build apk
    # Версия — последний тег v0.0.N, номер — N × 100 + 99 (scripts/build_number.sh):
    # выше любой CI-сборки этого тега (N × 100 + попытка), ниже следующего тега,
    # так что встаёт поверх сборки с CI без INSTALL_FAILED_VERSION_DOWNGRADE.
    # Подпись — release-ключом, если есть android/key.properties, иначе debug.
    vars:
      BUILD_NAME:
        sh: git fetch --tags -q 2>/dev/null || true; git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//'
      BUILD_NUMBER:
        sh: scripts/build_number.sh "$(git describe --tags --abbrev=0 --match 'v*' | sed 's/^v//')" 99
    cmds:
      - echo "{{.BUILD_NAME}} ({{.BUILD_NUMBER}})"
      - flutter build apk --release --split-per-abi --build-name={{.BUILD_NAME}} --build-number={{.BUILD_NUMBER}} && adb -s 48280DLAQ0026U install -r build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    silent: true
