syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

import "protos/client_config_v1.proto";

message Subscribe {
  message Request {
    // background — приложение запущено системой в фоне (VoIP / тихий пуш), а не
    // открыто пользователем: сервер не ставит сессии presence online, иначе
    // push-уведомления ей не уходят, пока стрим не отвалится по keepalive.
    // Онлайн поставит APP_STATE{foreground:true}, когда приложение откроют.
    // Старые клиенты поле не шлют (false) — как раньше, открытие стрима = online.
    bool background = 1;
    // Что умеет эта сборка клиента (сервер помнит на сессии). "secretChats" —
    // секретные чаты: запрос на секретный чат уходит только таким сессиям.
    // "groups" — группы (флаг «Группы» на экране «Разработчик», срез 3):
    // групповое (диалоги, журналы чатов, пуши) сервер отдаёт только таким
    // сессиям.
    repeated string capabilities = 2;
  }
  message Response {
    // Настройки приложения на момент подписки (дальше — пуш CLIENT_CONFIG).
    ClientConfig.Response clientConfig = 1;
  }
}
