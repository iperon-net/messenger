syntax = "proto3";

package v1;
option go_package = "internal/api/v1";

import "google/protobuf/timestamp.proto";

enum MessageType {
  HEALTHCHECK = 0;
  META_DATA_INFO = 1;
  AUTH_CALL_PASSWORD = 2;
  AUTH_CALL_PASSWORD_CONFIRMATION = 3;
  AUTH_MODERATION_APPLICATION_STORE = 4;
  AUTH_MODERATION_APPLICATION_STORE_CONFIRMATION = 5;
  DEVICE_SESSIONS = 6;
  LOGOUT = 7;
  SUBSCRIBE = 8;
  DEVICE_SESSIONS_TERMINATE = 9;
  AUTH_CONFIRMATION = 10;
  MY_PROFILE = 11;
  MY_PROFILE_UPDATE = 12;
  DEVICE_INFO_UPDATE = 13;
  MY_PROFILE_AVATAR_UPDATE = 14;
  UPLOAD_CONFIRM = 15;
  // 16..18, 21 — ручной WebRTC-сигналинг (CALL_OFFER/ANSWER/ICE_CANDIDATE и
  // CALL_ICE_SERVERS). Удалены при переезде на LiveKit (SFU берёт SDP/ICE на
  // себя); номера зарезервированы, чтобы их не переиспользовали.
  reserved 16, 17, 18, 21;
  CALL_HANGUP = 19;
  CALL_REJECT = 20;
  MY_PROFILE_USERNAME_UPDATE = 22;
  PROFILE = 23;
  CONTACTS_DISCOVERY_EVALUATE = 24;
  CONTACTS_DISCOVERY_MATCH = 25;
  REGISTER_PUSH_TOKEN = 26;
  CALL_TOKEN = 27;
  CALL_RING = 28;
  // Облачная адресная книга / серверный граф контактов (этап 1: гейт звонков).
  // UPSERT/REMOVE пишут рёбра владельца, PRIVACY_SETTINGS(_UPDATE) — настройку
  // «кто может звонить». См. contacts_v1.proto / privacy_v1.proto.
  CONTACTS_UPSERT = 29;
  CONTACTS_REMOVE = 30;
  PRIVACY_SETTINGS = 31;
  PRIVACY_SETTINGS_UPDATE = 32;
  // Облачные контакты (синхронизация PII между устройствами): LIST — pull всего
  // списка на bootstrap; UPDATED — push-дельта на устройства владельца. См.
  // contacts_v1.proto (Contact / ContactsList / ContactsUpdated).
  CONTACTS_LIST = 33;
  CONTACTS_UPDATED = 34;
  // Присутствие (online / last-seen) для списка контактов — pull batch по userID
  // (см. presence_v1.proto). Видимость гейтится звонковой приватностью.
  PRESENCE = 35;
  // Полная замена allow-list «всегда разрешать» для звонков (см.
  // privacy_v1.proto, PrivacyCallsAllowUpdate).
  PRIVACY_CALLS_ALLOW_UPDATE = 36;
  // Полная замена deny-list «всегда запрещать» для звонков (см.
  // privacy_v1.proto, PrivacyCallsDenyUpdate).
  PRIVACY_CALLS_DENY_UPDATE = 37;
  // Приватность дня рождения (аудитория + allow/deny + «скрыть год»). См.
  // privacy_v1.proto (PrivacyBirthday*Update / PrivacyHideBirthYearUpdate).
  PRIVACY_BIRTHDAY_UPDATE = 38;
  PRIVACY_BIRTHDAY_ALLOW_UPDATE = 39;
  PRIVACY_BIRTHDAY_DENY_UPDATE = 40;
  PRIVACY_HIDE_BIRTH_YEAR_UPDATE = 41;
  // Приватность «О себе» (аудитория + allow/deny). См. privacy_v1.proto
  // (PrivacyAboutMe*Update). Не разрешено — aboutMe в Profile.Response не отдаётся.
  PRIVACY_ABOUT_ME_UPDATE = 42;
  PRIVACY_ABOUT_ME_ALLOW_UPDATE = 43;
  PRIVACY_ABOUT_ME_DENY_UPDATE = 44;
}

service Iperon {
  rpc Unary (Message) returns (Message) {}
  rpc Stream (stream Message) returns (stream Message) {}
  rpc Upload (stream Upload.Request) returns (stream Upload.Response) {}
}

// Messages
message Message {
  MessageType messageType = 1;
  bytes message = 2;
  google.protobuf.Timestamp currentAt = 3;
}

// Upload (media files)
message Upload {
  message Init {
    string sessionId = 1;
    int64 fileSize = 2;
    optional string resumeUploadId = 3;
  }

  message Chunk {
    bytes data = 1;
  }

  message Done {
  }

  message InitAck {
    string uploadId = 1;
    int64 receivedBytes = 2;
  }

  message ChunkAck {
    int64 receivedBytes = 1;
  }

  message CompleteAck {
    string uploadId = 1;
    int64 receivedBytes = 2;
  }

  message Request {
    oneof payload {
      Init init = 1;
      Chunk chunk = 2;
      Done done = 3;
    }

  }

  message Response {
    oneof payload {
      InitAck initAck = 1;
      ChunkAck chunkAck = 2;
      CompleteAck completeAck = 3;
    }
  }
}
