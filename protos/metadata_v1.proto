syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// MetadataInfo
message MetadataInfo {

  message GitCommit {
    string full = 1;
    string short = 2;
  }

  message EdDSA {
    bytes publicKey = 1;
    string fingerprint = 2;
  }

  message MLDSA {
    bytes publicKey = 1;
    string fingerprint = 2;
  }

  message VOPRF {
    bytes publicKey = 1;
    string fingerprint = 2;
  }

  // Request
  message Request {}

  // Response
  message Response {

    EdDSA eddsa = 2;
    VOPRF voprf = 3;
    MLDSA mldsa = 4;

    GitCommit gitCommit = 5;
    string buildDate = 6;
    string version = 7;

  }
}


// GeoIP
message MetadataGeoIP {

  message Location {
    float latitude = 1;
    float longitude = 2;
  }

  message Country {
    string russianName = 1;
    string englishName = 2;
  }

  message City {
    string russianName = 1;
    string englishName = 2;
  }

  // Request
  message Request {
    optional string ip = 1;
  }

  // Response
  message Response {
    string timeZone = 1;
    string isoCode = 2;
    Location location = 3;
    Country country = 4;
    City city = 5;
    string ip = 6;
  }

}
