syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

import "google/protobuf/timestamp.proto";
import "protos/models.proto";


message MyProfile {
  message Request {}

  message Response {
    optional string firstName = 1;
    optional string lastName = 2;
    optional string aboutMe = 4;
    optional google.protobuf.Timestamp birthDate = 3;
    optional CDN avatar = 5;
    optional string username = 6;
    // Premium-тариф (создание секретных чатов и т.п.). Пока ставится вручную в БД.
    bool isPremium = 7;
    // ThumbHash аватара (как Profile.Response.avatarThumbhash).
    string avatarThumbhash = 8;
  }
}

message MyProfileUpdate {
  message Request {
    optional string firstName = 1;
    optional string lastName = 2;
    optional string aboutMe = 4;
    optional google.protobuf.Timestamp birthDate = 3;
  }

  message Response {
  }
}

message MyProfileAvatarUpdate {
  message Request {
    bytes cdnID = 1;
    // ThumbHash картинки (base64, считает клиент — сервер картинку не
    // декодирует). Тот же cdnID с thumbhash — дописать превью к уже
    // установленному аватару (загруженному до появления поля), файл не
    // меняется. Невалидный (не base64 или длиннее 64 байт) — отбрасывается.
    string thumbhash = 2;
  }

  message Response {
    optional CDN avatar = 1;
  }
}


message MyProfileUserNameUpdate {
  message Request {
    string username = 1;
  }

  message Response {
  }
}
