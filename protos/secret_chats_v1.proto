syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// Секретные чаты (E2EE 1-на-1, как Secret Chats в Telegram): чат — пара
// УСТРОЙСТВ (сессий), а не пользователей; на других устройствах его нет,
// истории на сервере нет. Сервер не видит содержимого — только пересылает
// непрозрачные байты рукопожатия и конверты сообщений. Крипта — на клиенте
// (lib/crypto/secret_chat.dart), план — docs/plans/secret-chats-e2ee.md
// в репозитории клиента.
//
// Типы сообщений: SECRET_CHATS — запрос → ответ (oneof действия внутри),
// SECRET_UPDATES — push по стриму в КОНКРЕТНУЮ сессию (SecretUpdates).
//
// Очередь устройства: всё, что адресовано сессии (запрос чата, ответ, раскрытие,
// сообщение, закрытие), ложится в её очередь с qts — номер на сессию,
// возрастающий (1, 2, 3 …). Push по стриму несёт событие сразу; клиент применяет
// строго по qts, дыра (пропущенный push) → GetUpdates(afterQts), и его ответ —
// истина: дыры без событий возможны (повтор Send сжигает номер). Ack(maxQts)
// удаляет из очереди всё ≤ maxQts — до подтверждения событие выдаётся снова.
// Недоставленное живёт secretChats.queueTtl (по умолчанию 30 дней).
//
// Рукопожатие (размеры — X25519 / ML-KEM-768):
//   A Create{commitment 32}            → устройствам B: requested
//   B Accept{ephemeralKey 32, kemPublicKey 1184}
//                                      → A: accepted; остальным устройствам B:
//                                        discarded(ACCEPTED_ELSEWHERE)
//   A Commit{ephemeralKey 32, nonce 32, kemCiphertext 1088, ratchetKey 32}
//                                      → B: committed — чат READY
// Запрос получают только сессии собеседника с поддержкой секретных чатов
// (Subscribe.Request.capabilities содержит "secretChats").
//
// Ошибки (gRPC-код + текст — его разбирает клиент):
//   FailedPrecondition "secretChat.disabled"        — фича выключена (secretChats.enabled)
//   FailedPrecondition "secretChat.premiumRequired" — создавать может только Premium
//   FailedPrecondition "secretChat.peerUnsupported" — у собеседника нет поддерживающих устройств
//   FailedPrecondition "secretChat.frozen"          — переписка временно остановлена сервером
//   FailedPrecondition "secretChat.badState"        — действие не подходит к состоянию чата
//   NotFound          "secretChat.notFound"         — нет чата или он не этого устройства
//   PermissionDenied  "privacyRestricted"           — собеседник ограничил, кто может ему писать
//   ResourceExhausted "floodWait:<секунды>"         — лимит частоты
//   PermissionDenied  "secretChat.fileForbidden"   — файл Send не свой / не непрозрачный / уже в другом чате
//   InvalidArgument                                  — неверные длины/поля

message SecretChat {
  enum State {
    // A отправил запрос, ждём, какое устройство B примет.
    REQUESTED = 0;
    // B принял, ждём раскрытия коммитмента от A.
    ACCEPTED = 1;
    // Рукопожатие завершено — можно переписываться.
    READY = 2;
    // Закрыт (одной из сторон, сервером — сессия завершена/истёк запрос).
    DISCARDED = 3;
  }

  bytes secretChatID = 1;
  // Кто начал (A) и с кем (B). Сессии в протокол не выдаём: устройство знает
  // только, что чат его.
  bytes initiatorUserID = 2;
  bytes peerUserID = 3;
  State state = 4;
  int64 date = 5; // unix millis создания
}

message SecretUpdate {
  // A → устройствам B: запрос на секретный чат.
  message Requested {
    bytes fromUserID = 1;
    bytes commitment = 2;
  }
  // B → A: устройство B приняло.
  message Accepted {
    bytes ephemeralKey = 1;
    bytes kemPublicKey = 2;
  }
  // A → B: раскрытие коммитмента — рукопожатие завершено.
  message Committed {
    bytes ephemeralKey = 1;
    bytes nonce = 2;
    bytes kemCiphertext = 3;
    bytes ratchetKey = 4;
  }
  // Сообщение собеседника: конверт храповика (шифротекст).
  message NewMessage {
    int64 randomID = 1;
    bytes envelope = 2;
  }
  // Чат закрыт.
  message Discarded {
    enum Reason {
      // Собеседник закрыл (или отклонил запрос, или отозвал свой).
      BY_PEER = 0;
      // Запрос принят другим устройством этого же пользователя.
      ACCEPTED_ELSEWHERE = 1;
      // Сессия собеседника завершена (выход, удаление устройства).
      SESSION_ENDED = 2;
      // Запрос не приняли за отведённое время.
      EXPIRED = 3;
    }
    Reason reason = 1;
    // Собеседник попросил удалить переписку и у меня.
    bool deleteHistory = 2;
  }

  int64 qts = 1;
  int64 date = 2; // unix millis события
  bytes secretChatID = 3;
  oneof update {
    Requested requested = 4;
    Accepted accepted = 5;
    Committed committed = 6;
    NewMessage newMessage = 7;
    Discarded discarded = 8;
  }
}

// Файл секретного чата: где лежит шифротекст. Расшифровать его можно только
// ключом из SecretPayload (SecretMedia).
message SecretFile {
  bytes fileID = 1;
  string url = 2;
}

// Push по стриму (SECRET_UPDATES) в сессию.
message SecretUpdates {
  repeated SecretUpdate updates = 1;
}

message SecretChats {
  // A: начать секретный чат с userID. randomID — идемпотентность повтора.
  message Create {
    bytes userID = 1;
    bytes commitment = 2;
    int64 randomID = 3;
  }
  message CreateResult {
    SecretChat chat = 1;
  }

  // B: принять запрос (первое принявшее устройство забирает чат).
  message Accept {
    bytes secretChatID = 1;
    bytes ephemeralKey = 2;
    bytes kemPublicKey = 3;
  }
  message AcceptResult {
    SecretChat chat = 1;
  }

  // A: раскрыть коммитмент.
  message Commit {
    bytes secretChatID = 1;
    bytes ephemeralKey = 2;
    bytes nonce = 3;
    bytes kemCiphertext = 4;
    bytes ratchetKey = 5;
  }
  message CommitResult {
    SecretChat chat = 1;
  }

  // Закрыть чат / отклонить запрос / отозвать свой.
  message Discard {
    bytes secretChatID = 1;
    bool deleteHistory = 2;
  }
  message DiscardResult {}

  // Отправить конверт собеседнику. Повтор того же randomID в течение жизни
  // очереди не дублирует сообщение.
  //
  // fileIDs — файлы сообщения (cdnID непрозрачных загрузок отправителя,
  // UploadConfirm.opaque): сервер прикрепляет их к чату — после этого ссылку
  // на них выдаёт GetFiles обоим участникам. Ключи файлов — внутри конверта.
  message Send {
    bytes secretChatID = 1;
    int64 randomID = 2;
    bytes envelope = 3;
    repeated bytes fileIDs = 4;
  }
  message SendResult {
    int64 date = 1; // unix millis — время сервера
  }

  // Неподтверждённые события моей очереди с qts > afterQts по порядку.
  message GetUpdates {
    int64 afterQts = 1;
    int32 limit = 2;
  }
  message GetUpdatesResult {
    repeated SecretUpdate updates = 1;
    bool hasMore = 2;
  }

  // Подтвердить обработку всего ≤ maxQts (удаляется из очереди).
  message Ack {
    int64 maxQts = 1;
  }
  message AckResult {}

  // Ссылки на файлы чата (для скачивания шифротекста). Только участнику и
  // только файлы, прикреплённые к этому чату; чужие / удалённые — пропускаются.
  // Ссылка временная (как у вложений чатов): 403 — взять свежую.
  message GetFiles {
    bytes secretChatID = 1;
    repeated bytes fileIDs = 2;
  }
  message GetFilesResult {
    repeated SecretFile files = 1;
  }

  // Файлы больше не нужны (удалили сообщения у обоих): сервер удалит их
  // позже (сборка мусора). Чужие / уже удалённые — без ошибки. Закрытие чата
  // освобождает все его файлы само.
  message ReleaseFiles {
    bytes secretChatID = 1;
    repeated bytes fileIDs = 2;
  }
  message ReleaseFilesResult {}

  message Request {
    oneof request {
      // createChat, а не create: в Dart `create` — служебный метод сообщения.
      Create createChat = 1;
      Accept accept = 2;
      Commit commit = 3;
      Discard discard = 4;
      Send send = 5;
      GetUpdates getUpdates = 6;
      Ack ack = 7;
      GetFiles getFiles = 8;
      ReleaseFiles releaseFiles = 9;
    }
  }

  message Response {
    oneof response {
      CreateResult createChat = 1;
      AcceptResult accept = 2;
      CommitResult commit = 3;
      DiscardResult discard = 4;
      SendResult send = 5;
      GetUpdatesResult getUpdates = 6;
      AckResult ack = 7;
      GetFilesResult getFiles = 8;
      ReleaseFilesResult releaseFiles = 9;
    }
  }
}
