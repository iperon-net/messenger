syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// Облачный пароль (двухшаговая проверка) + email для восстановления.
//
// Клиент НИКОГДА не шлёт пароль в открытом виде: по проводу идёт pre-hash
// pwHash = SHA-256("iperon-cloud-pw-v1" || utf8(password)) (32 байта), а сервер
// применяет поверх argon2id с солью. Pre-hash защищает plaintext от сервера/логов
// (reuse-харвестинг), но остаётся password-эквивалентом и реплеится при вскрытом
// TLS — поэтому канал обязан быть TLS и pwHash не логируется.
// См. docs/plans/hidden-toasting-mountain.md (клиентский репозиторий).

// ── Pre-auth (вход, до сессии — unary, как AUTH_CALL_PASSWORD) ──────────────

// Второй шаг входа: проверка облачного пароля по confirmationSession.
message AuthCloudPassword {
  message Request {
    bytes confirmationSession = 1;
    bytes pwHash = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
    // Сколько попыток осталось до инвалидации confirmationSession.
    optional int32 attemptsLeft = 3;
  }
}

// «Забыли пароль?»: отправка кода восстановления на привязанный email.
message AuthCloudPasswordRecovery {
  message Request {
    bytes confirmationSession = 1;
  }

  message Response {
    // Маскированный email (напр. "k***@gmail.com") для показа пользователю.
    string maskedEmail = 1;
    optional string error = 2;
  }
}

// Подтверждение восстановления: код из письма + новый пароль (pre-hash).
message AuthCloudPasswordRecoveryConfirm {
  message Request {
    bytes confirmationSession = 1;
    string code = 2;
    bytes newPwHash = 3;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// ── Authenticated (настройки — через exchangeEncrypted, как MY_PROFILE_UPDATE) ──

// Текущее состояние облачного пароля для экрана настроек.
message CloudPasswordInfo {
  message Request {}

  message Response {
    bool isEnabled = 1;
    string maskedEmail = 2;
    bool isEmailVerified = 3;
  }
}

// Установка/смена пароля. currentPwHash пуст при первичной установке.
message CloudPasswordSet {
  message Request {
    bytes currentPwHash = 1;
    bytes newPwHash = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Отключение облачного пароля (с проверкой текущего).
message CloudPasswordDisable {
  message Request {
    bytes currentPwHash = 1;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Привязка/смена email: шлёт код верификации на новый адрес.
message CloudPasswordEmailSet {
  message Request {
    bytes currentPwHash = 1;
    string email = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Подтверждение email кодом из письма.
message CloudPasswordEmailVerify {
  message Request {
    string code = 1;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Проверка текущего пароля для «разблокировки» раздела настроек (когда пароль
// установлен). Успех открывает меню; неверный — ошибка.
message CloudPasswordVerify {
  message Request {
    bytes pwHash = 1;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Восстановление в настройках: отправка кода на уже привязанный (подтверждённый)
// email, когда пользователь забыл облачный пароль.
message CloudPasswordRecoverySend {
  message Request {}

  message Response {
    string maskedEmail = 1;
    optional string error = 2;
  }
}

// Сброс пароля по коду из письма (после CloudPasswordRecoverySend). Ставит новый
// пароль без знания старого и ОЧИЩАЕТ email (его нужно привязать заново).
message CloudPasswordReset {
  message Request {
    string code = 1;
    bytes newPwHash = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}
