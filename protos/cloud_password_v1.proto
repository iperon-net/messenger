syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// Облачный пароль (двухшаговая проверка) + email для восстановления.
//
// Пароль проверяется по OPAQUE-3DH (RFC 9807): ни пароль, ни что-либо ему
// равноценное на сервер не попадает. Конфигурация: OPRF ristretto255-SHA512,
// HKDF/HMAC/SHA-512, AKE ristretto255, context "iperon-cloud-password-v1",
// идентичности — публичные ключи сторон, credential_identifier — userID
// (12 байт). KSF (Argon2id) — только на клиенте. Сообщения ниже несут
// сериализованные структуры RFC как есть:
//   registrationRequest  — RegistrationRequest  (32 байта)
//   registrationResponse — RegistrationResponse (64)
//   record               — RegistrationRecord   (192)
//   ke1 / ke2 / ke3      — KE1 (96) / KE2 (320) / KE3 (64)
// Неверный пароль клиент узнаёт сам, на KE2 (конверт не расшифровывается), и
// KE3 не шлёт — поэтому попытку засчитывает начало обмена (*Start).
//
// Регистрация (установка, смена, сброс пароля) — RegisterStart → RegisterFinish.
// Действия в настройках, требующие пароля (смена, отключение, email, передача
// владения группой), идут с одноразово выданным `token` — его даёт успешный
// CloudPasswordAuthFinish (или CloudPasswordReset — только для новой
// регистрации); живёт 10 минут.

// ── Pre-auth (вход, до сессии — unary, как AUTH_CALL_PASSWORD) ──────────────

// Вход, шаг 1: KE1 → KE2. Каждый вызов — попытка (не больше 5 на
// confirmationSession, плюс лимит на аккаунт).
message AuthCloudPasswordStart {
  message Request {
    bytes confirmationSession = 1;
    bytes ke1 = 2;
  }

  message Response {
    bytes ke2 = 1;
    // Сколько попыток останется, если эта окажется неверной.
    int32 attemptsLeft = 2;
  }
}

// Вход, шаг 2: KE3. Успех помечает confirmationSession пройденной — дальше
// AUTH_CONFIRMATION.
message AuthCloudPasswordFinish {
  message Request {
    bytes confirmationSession = 1;
    bytes ke3 = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// «Забыли пароль?»: отправка кода восстановления на привязанный email.
message AuthCloudPasswordRecovery {
  message Request {
    bytes confirmationSession = 1;
    // Email, введённый пользователем. Код шлётся только если совпадает с
    // привязанным подтверждённым адресом аккаунта; иначе сервер молчит, но ответ
    // тот же — чтобы нельзя было перебором узнать чужие email в базе.
    string email = 2;
  }

  message Response {
    // Не заполняется (раньше — маскированный email).
    string maskedEmail = 1;
    optional string error = 2;
  }
}

// Подтверждение восстановления кодом из письма. Успех открывает регистрацию
// нового пароля по этой confirmationSession (AuthCloudPasswordRegister*).
message AuthCloudPasswordRecoveryConfirm {
  message Request {
    bytes confirmationSession = 1;
    string code = 2;
    // 3 — newPwHash (до OPAQUE).
    reserved 3;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Новый пароль при входе (после AuthCloudPasswordRecoveryConfirm), шаг 1.
message AuthCloudPasswordRegisterStart {
  message Request {
    bytes confirmationSession = 1;
    bytes registrationRequest = 2;
  }

  message Response {
    bytes registrationResponse = 1;
  }
}

// Новый пароль при входе, шаг 2: запись сохраняется, confirmationSession
// помечается пройденной — дальше AUTH_CONFIRMATION.
message AuthCloudPasswordRegisterFinish {
  message Request {
    bytes confirmationSession = 1;
    bytes record = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// ── Authenticated (настройки — через exchangeEncrypted, как MY_PROFILE_UPDATE) ──

// Текущее состояние облачного пароля для экрана настроек.
message CloudPasswordInfo {
  message Request {}

  message Response {
    bool isEnabled = 1;
    string maskedEmail = 2;
    bool isEmailVerified = 3;
  }
}

// Проверка пароля в настройках («разблокировка»), шаг 1: KE1 → KE2.
message CloudPasswordAuthStart {
  message Request {
    bytes ke1 = 1;
  }

  message Response {
    bytes ke2 = 1;
  }
}

// Проверка пароля в настройках, шаг 2: KE3 → token для действий.
message CloudPasswordAuthFinish {
  message Request {
    bytes ke3 = 1;
  }

  message Response {
    bytes token = 1;
  }
}

// Установка / смена / сброс пароля, шаг 1. token не нужен, только если
// пароля ещё нет.
message CloudPasswordRegisterStart {
  message Request {
    bytes token = 1;
    bytes registrationRequest = 2;
  }

  message Response {
    bytes registrationResponse = 1;
  }
}

// Установка / смена / сброс пароля, шаг 2. После смены выданные token'ы
// больше не действуют.
message CloudPasswordRegisterFinish {
  message Request {
    bytes token = 1;
    bytes record = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Отключение облачного пароля.
message CloudPasswordDisable {
  message Request {
    // 1 — currentPwHash (до OPAQUE).
    reserved 1;
    bytes token = 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Привязка/смена email: шлёт код верификации на новый адрес. token нужен, если
// пароль установлен (email можно привязать и до пароля).
message CloudPasswordEmailSet {
  message Request {
    // 1 — currentPwHash (до OPAQUE).
    reserved 1;
    string email = 2;
    bytes token = 3;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Подтверждение email кодом из письма.
message CloudPasswordEmailVerify {
  message Request {
    string code = 1;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
  }
}

// Восстановление в настройках: отправка кода на уже привязанный (подтверждённый)
// email, когда пользователь забыл облачный пароль.
message CloudPasswordRecoverySend {
  message Request {}

  message Response {
    string maskedEmail = 1;
    optional string error = 2;
  }
}

// Сброс пароля по коду из письма (после CloudPasswordRecoverySend): выдаёт
// token, годный только для CloudPasswordRegister* (новый пароль без старого).
// Привязанный email сохраняется.
message CloudPasswordReset {
  message Request {
    string code = 1;
    // 2 — newPwHash (до OPAQUE).
    reserved 2;
  }

  message Response {
    bool success = 1;
    optional string error = 2;
    bytes token = 3;
  }
}
