syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// Настройки приватности per-channel (этап 1 — только звонки). Проверка «кто
// может» всегда по стороне получателя. Документ настроек не материализуется до
// первого изменения: отсутствие значения трактуется гейтом как дефолт CONTACTS.
message PrivacySettings {
  // Аудитория канала: EVERYBODY — кто угодно; CONTACTS — только те, у кого
  // отправитель есть в контактах (ребро owner→sender); NOBODY — никто (действие
  // запрещено всем). favorites/messages/group_invites — следующие этапы.
  enum Audience {
    EVERYBODY = 0;
    CONTACTS = 1;
    NOBODY = 2;
  }

  // Чтение текущих настроек.
  message Request {}

  message Response {
    Audience calls = 1;
    // Allow-list «всегда разрешать» для звонков: userID (ObjectID, 12 байт),
    // которым звонок разрешён независимо от `calls` (в т.ч. при NOBODY).
    repeated bytes calls_allow = 2;
  }
}

// Изменение аудитории «кто может звонить».
message PrivacySettingsUpdate {
  message Request {
    PrivacySettings.Audience calls = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для звонков.
message PrivacyCallsAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}
