syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

// Настройки приватности per-channel (этап 1 — только звонки). Проверка «кто
// может» всегда по стороне получателя. Документ настроек не материализуется до
// первого изменения: отсутствие значения трактуется гейтом как дефолт CONTACTS.
message PrivacySettings {
  // Аудитория канала: EVERYBODY — кто угодно; CONTACTS — только те, у кого
  // отправитель есть в контактах (ребро owner→sender); NOBODY — никто (действие
  // запрещено всем). favorites/messages/group_invites — следующие этапы.
  enum Audience {
    EVERYBODY = 0;
    CONTACTS = 1;
    NOBODY = 2;
  }

  // Чтение текущих настроек.
  message Request {}

  message Response {
    Audience calls = 1;
    // Allow-list «всегда разрешать» для звонков: userID (ObjectID, 12 байт),
    // которым звонок разрешён независимо от `calls` (в т.ч. при NOBODY).
    repeated bytes calls_allow = 2;
    // Deny-list «всегда запрещать» для звонков: userID (ObjectID, 12 байт),
    // которым звонок запрещён независимо от `calls` (в т.ч. при CONTACTS).
    repeated bytes calls_deny = 3;
    // Аудитория «кто может видеть мою дату рождения» + её allow/deny-списки
    // (та же семантика, что у звонков). Гейт применяется на стороне владельца
    // профиля при отдаче Profile.Response.
    Audience birthday = 4;
    repeated bytes birthday_allow = 5;
    repeated bytes birthday_deny = 6;
    // Скрывать год рождения (и возраст) от тех, кому дата рождения видна: сервер
    // отдаёт им дату с обнулённым годом (sentinel) и Profile.hide_birth_year=true.
    bool hide_birth_year = 7;
    // Аудитория «кто может видеть моё „О себе“» + её allow/deny-списки (та же
    // семантика, что у звонков/дня рождения). Гейт применяется на стороне
    // владельца профиля: не разрешено — aboutMe в Profile.Response не отдаётся.
    Audience about_me = 8;
    repeated bytes about_me_allow = 9;
    repeated bytes about_me_deny = 10;
    // Аудитория «кто может видеть моё последнее посещение и статус онлайн» + её
    // allow/deny-списки (та же семантика). Гейтит весь Presence_Item (и online, и
    // last-seen). ВЗАИМНОСТЬ: если у смотрящего свой last_seen = NOBODY, он не
    // видит ничьё присутствие — «скрылся от всех ⇒ сам никого не видит».
    Audience last_seen = 11;
    repeated bytes last_seen_allow = 12;
    repeated bytes last_seen_deny = 13;
    // Аудитория «кто может мне писать» (личные сообщения) + её allow/deny-списки
    // (та же семантика). ДЕФОЛТ — EVERYBODY (как в Telegram; у остальных
    // каналов — CONTACTS). Гейт — при отправке в личный чат по стороне
    // получателя; отказ — PermissionDenied «privacyRestricted». Если получатель
    // уже писал в этот чат (после своей последней очистки истории) — отвечать
    // можно и при CONTACTS/NOBODY (deny-list перекрывает и это).
    Audience messages = 14;
    repeated bytes messages_allow = 15;
    repeated bytes messages_deny = 16;
    // «Скрывать время прочтения» — от тех, кому не видно моё последнее
    // посещение (last_seen + исключения): «Прочитано в 12:30» в личном чате им
    // не отдаётся (галочки ✓✓ остаются). ВЗАИМНО: включивший сам не видит
    // чужое время прочтения.
    bool hide_read_time = 17;
    // Аудитория «кто может добавить ссылку на мой аккаунт при пересылке моих
    // сообщений» + её allow/deny-списки (та же семантика). ДЕФОЛТ — EVERYBODY
    // (как в Telegram). Проверяется на сервере при пересылке по пересылающему:
    // не разрешено — в MessageForward остаётся только имя (без fromUserID),
    // «Переслано от …» не ведёт в профиль. Свои сообщения — всегда со ссылкой.
    Audience forwards = 18;
    repeated bytes forwards_allow = 19;
    repeated bytes forwards_deny = 20;
    // Автоудаление по умолчанию для новых чатов (как setDefaultHistoryTTL в
    // Telegram): секунды, 0 — выключено. Личный чат без таймера, в который
    // этот пользователь пишет первым, получает такой таймер (со служебным
    // MessageTTLChanged.auto); существующие не меняются, «Избранное» — без.
    int32 messages_ttl = 21;
    // Заблокированные пользователи (userID, ObjectID 12 байт), как в Telegram:
    // не могут писать мне в личные чаты (и я им — пока не разблокирую), звонить
    // (в обе стороны), начинать секретный чат; не видят моё «в сети» / время
    // захода, «О себе», день рождения и аватар, их пересылки — без ссылки на
    // мой аккаунт. Заблокированный об этом не узнаёт: для него это обычные
    // отказы приватности («privacyRestricted», «call not allowed»).
    repeated bytes blocked = 22;
    // Аудитория «кто видит мой номер телефона» + её allow/deny-списки (та же
    // семантика, что у звонков; дефолт — CONTACTS, как в Telegram). Гейт — на
    // стороне владельца при отдаче Profile.Response: не разрешено — phoneNumber
    // не отдаётся. Тот, у кого мой номер уже есть в книге (ребро с номером),
    // видит его всегда — номер ему и так известен.
    Audience phone_number = 23;
    repeated bytes phone_number_allow = 24;
    repeated bytes phone_number_deny = 25;
    // «Кто может найти меня по номеру» (поиск по номеру, сопоставление книги
    // контактов): EVERYBODY (дефолт) или CONTACTS (NOBODY не бывает — как в
    // Telegram). Те, кому номер виден (phone_number + исключения), находят
    // всегда.
    Audience phone_number_find = 26;
  }
}

// Изменение аудитории «кто может звонить».
message PrivacySettingsUpdate {
  message Request {
    PrivacySettings.Audience calls = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для звонков.
message PrivacyCallsAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для звонков.
message PrivacyCallsDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Изменение аудитории «кто может видеть мою дату рождения».
message PrivacyBirthdayUpdate {
  message Request {
    PrivacySettings.Audience birthday = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для дня рождения.
message PrivacyBirthdayAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для дня рождения.
message PrivacyBirthdayDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Переключение «скрывать год рождения и возраст».
message PrivacyHideBirthYearUpdate {
  message Request {
    bool hide = 1;
  }

  message Response {}
}

// Переключение «скрывать время прочтения».
message PrivacyHideReadTimeUpdate {
  message Request {
    bool hide = 1;
  }

  message Response {}
}

// Изменение аудитории «кто может видеть моё „О себе“».
message PrivacyAboutMeUpdate {
  message Request {
    PrivacySettings.Audience about_me = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для «О себе».
message PrivacyAboutMeAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для «О себе».
message PrivacyAboutMeDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Изменение аудитории «кто может видеть моё последнее посещение».
message PrivacyLastSeenUpdate {
  message Request {
    PrivacySettings.Audience last_seen = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для последнего посещения.
message PrivacyLastSeenAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для последнего посещения.
message PrivacyLastSeenDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Изменение аудитории «кто может мне писать».
message PrivacyMessagesUpdate {
  message Request {
    PrivacySettings.Audience messages = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для сообщений.
message PrivacyMessagesAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для сообщений.
message PrivacyMessagesDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Изменение аудитории «кто может добавить ссылку на мой аккаунт при пересылке».
message PrivacyForwardsUpdate {
  message Request {
    PrivacySettings.Audience forwards = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для пересылки.
message PrivacyForwardsAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для пересылки.
message PrivacyForwardsDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Автоудаление по умолчанию для новых чатов: period — секунды, 0 — выключить,
// иначе от суток до года, кратно суткам (иначе INVALID_ARGUMENT «ttlInvalid»).
message PrivacyMessagesTTLUpdate {
  message Request {
    int32 period = 1;
  }

  message Response {}
}

// Заблокировать / разблокировать одного пользователя (PrivacySettings.blocked).
// Свой userID — INVALID_ARGUMENT. После записи снимок настроек рассылается на
// все устройства владельца (PRIVACY_SETTINGS).
message PrivacyBlockUpdate {
  message Request {
    bytes user_id = 1;
    bool blocked = 2;
  }

  message Response {}
}

// Изменение аудитории «кто видит мой номер телефона».
message PrivacyPhoneNumberUpdate {
  message Request {
    PrivacySettings.Audience phone_number = 1;
  }

  message Response {}
}

// Полная замена allow-list «всегда разрешать» для номера телефона.
message PrivacyPhoneNumberAllowUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Полная замена deny-list «всегда запрещать» для номера телефона.
message PrivacyPhoneNumberDenyUpdate {
  message Request {
    repeated bytes user_ids = 1;
  }

  message Response {}
}

// Изменение «кто может найти меня по номеру»: только EVERYBODY или CONTACTS
// (NOBODY — INVALID_ARGUMENT).
message PrivacyPhoneNumberFindUpdate {
  message Request {
    PrivacySettings.Audience phone_number_find = 1;
  }

  message Response {}
}
