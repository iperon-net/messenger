syntax = "proto3";

package iperon.v1;
option go_package = "internal/api/v1";

import "protos/models.proto";

// Назначение файла — пишется в запись cdn (отчёты по месту, сборщик). Клиент
// указывает его для папки «chats» (вложение или превью); аватары и файлы
// секретных чатов сервер определяет сам по папке / opaque.
enum CdnKind {
  CDN_KIND_UNSPECIFIED = 0; // старый клиент: в «chats» — как MEDIA
  CDN_KIND_MEDIA = 1;       // вложение сообщения
  CDN_KIND_THUMB = 2;       // превью фото / обложка видео
  CDN_KIND_AVATAR = 3;      // аватар профиля или группы
}

message UploadConfirm {
  message Request {
    string uploadId = 1;
    bytes encryptionKey = 2;
    bytes hkdfSalt = 3;
    reserved 4;
    reserved "fileName";
    string contentType = 5;
    string folder = 6;
    // Непрозрачная загрузка (секретные чаты, docs/plans/secret-chats-e2ee.md
    // в репозитории клиента): ключа у сервера нет — encryptionKey / hkdfSalt
    // пустые, folder игнорируется (сервер кладёт в «secret»). Ключ, соль и хеш
    // уходят собеседнику внутри зашифрованного SecretPayload. Такой файл
    // нельзя прикрепить к обычному сообщению или аватару; ссылку выдаёт только
    // SecretChats.GetFiles участнику чата, к которому файл прикреплён (Send).
    bool opaque = 7;
    CdnKind kind = 8;
  }

  message Response {
    CDN cdn = 1;
  }
}
